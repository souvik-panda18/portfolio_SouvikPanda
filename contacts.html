<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Souvik</title>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2.3.2/dist/email.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-black font-sans " >
    
     <!-- Navbar -->
     <nav class="bg-black p-6  w-full top-0 shadow-lg shadow-[#7A73D1] z-50 flex items-center justify-between">
        <img src="Animation - 1742287435949.gif" alt="Logo" class="w-12 h-12 rounded-full shadow-md">
        <ul class="hidden md:flex space-x-10 text-2xl font-semibold">
            <li><a href="index.html" class="text-white hover:text-blue-400">Home</a></li>
            <li><a href="skills.html" class="text-white hover:text-blue-400">Skills</a></li>
            <li><a href="resume.html" class="text-white hover:text-blue-400">Resume</a></li>
            <li><a href="projects.html" class="text-white hover:text-blue-400">Projects</a></li>
            <li><a href="contacts.html" class="text-white hover:text-blue-400">Contacts</a></li>
        </ul>
        <button class="md:hidden text-white text-2xl" id="menu-toggle">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>

    <!-- Mobile Menu -->
    <div class="hidden md:hidden bg-black text-white text-center p-4 space-y-4" id="mobile-menu">
        <a href="index.html" class="block hover:text-blue-400">Home</a>
        <a href="skills.html" class="block hover:text-blue-400">Skills</a>
        <a href="resume.html" class="block hover:text-blue-400">Resume</a>
        <a href="projects.html" class="block hover:text-blue-400">Projects</a>
        <a href="contacts.html" class="block hover:text-blue-400">Contacts</a>
    </div>

    <!-- Contact Form -->
    <div class="max-w-lg mx-auto mt-24 p-8 bg-[#FFEDFA] shadow-lg rounded-lg">
     <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Contact Me</h2>
        <form id="contact-form">
            <div class="mb-4">
                <label class="block text-gray-700">Name:</label>
                <input type="text" id="name" name="name" required class="w-full p-3 border border-black rounded-md focus:border-blue-400 focus:outline-none">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Email:</label>
                <input type="email" id="email" name="email" required class="w-full p-3 border border-black rounded-md focus:border-blue-400 focus:outline-none">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Message:</label>
                <textarea id="message" name="message" rows="5" required class="w-full p-3 border border-black rounded-md focus:border-blue-400 focus:outline-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white p-3 rounded-md hover:bg-blue-600">Send</button>
        </form>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white text-center p-6 mt-12">
        <h3 class="text-xl font-bold">Souvik</h3>
        <p class="text-gray-400">Feel free to contact me through the links below.</p>
        <div class="flex justify-center space-x-6 mt-4">
            <a href="https://www.facebook.com/souvik.panda.1650" class="text-gray-400 hover:text-blue-400"><i class="fab fa-facebook text-2xl"></i></a>
            <a href="https://www.instagram.com/_souvik_101/?hl=en" class="text-gray-400 hover:text-pink-400"><i class="fab fa-instagram text-2xl"></i></a>
            <a href="https://github.com/souvik-panda18" class="text-gray-400 hover:text-gray-300"><i class="fab fa-github text-2xl"></i></a>
            <a href="https://www.linkedin.com/in/souvik-panda-60bb02250/" class="text-gray-400 hover:text-blue-300"><i class="fab fa-linkedin text-2xl"></i></a>
        </div>
        <p class="text-gray-500 mt-4">&copy; 2023 Souvik Panda. Designed by <span class="text-blue-400">Souvik</span></p>
    </footer>

    <script>  
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');

        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
        (function(){
            emailjs.init("YOUR_USER_ID"); // Replace with your EmailJS user ID
        })();

        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const serviceID = 'YOUR_SERVICE_ID'; // Replace with your EmailJS service ID
            const templateID = 'YOUR_TEMPLATE_ID'; // Replace with your EmailJS template ID

            emailjs.sendForm(serviceID, templateID, this)
                .then(() => {
                    alert('Your message has been sent successfully!');
                    this.reset();
                }, (error) => {
                    alert('Failed to send your message. Please try again.');
                    console.log('FAILED...', error);
                });
        });
    </script>   
</body>
</html>
